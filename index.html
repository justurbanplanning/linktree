<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@justurbanplanning — Route Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#ffffff;
    --ink-2:#f5f6fd;
    --paper:#1c1f3b;
    --paper-dim:#6f74a8;
    --amber:#ffd182;
    --amber-ink:#6b4d10;
    --blue:#4d5be3;
    --slate:#dcdff7;
  }

  *{ box-sizing:border-box; }
  html{ -webkit-tap-highlight-color:transparent; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse 800px 400px at 50% -10%, rgba(77,91,227,0.07), transparent),
      var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100svh;
    display:flex;
    justify-content:center;
    padding:56px 20px 80px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }

  .page{
    width:100%;
    max-width:440px;
  }

  /* ---------- Header ---------- */
  .header{
    text-align:center;
    margin-bottom:40px;
  }

  .badge{
    width:96px;
    height:96px;
    margin:0 auto 18px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 0 0 3px var(--ink), 0 0 0 4.5px var(--slate);
  }
  .badge img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:8px;
  }

  h1{
    font-family:'Archivo Expanded', sans-serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:-0.01em;
    margin:0 0 10px;
  }

  .header p{
    font-size:14.5px;
    line-height:1.55;
    color:var(--paper-dim);
    margin:0 auto;
    max-width:320px;
  }

  .stats{
    display:flex;
    justify-content:center;
    gap:22px;
    margin-top:18px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--paper-dim);
  }
  .stats strong{
    color:var(--paper);
    font-size:14px;
    display:block;
  }

  /* ---------- Line / stops ---------- */
  .line-wrap{
    position:relative;
    padding-left:34px;
  }

  .track{
    position:absolute;
    left:9px;
    top:6px;
    bottom:6px;
    width:2px;
    background:var(--slate);
    overflow:hidden;
  }
  .track::after{
    content:'';
    position:absolute;
    left:0; top:0; width:100%;
    height:100%;
    background:linear-gradient(var(--blue), var(--amber));
    transform:translateY(-100%);
    animation:draw 1.1s cubic-bezier(.65,0,.35,1) 0.15s forwards;
  }
  @keyframes draw{ to{ transform:translateY(0); } }

  .stop{
    position:relative;
    margin-bottom:16px;
    opacity:0;
    animation:rise .5s ease forwards;
  }
  .stop:nth-child(2){ animation-delay:.35s; }
  .stop:nth-child(3){ animation-delay:.55s; }
  .stop:nth-child(4){ animation-delay:.75s; }
  .stop:nth-child(5){ animation-delay:.95s; }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .dot{
    position:absolute;
    left:-34px;
    top:22px;
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--ink);
    border:2px solid var(--blue);
  }

  a.card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    background:var(--ink-2);
    border:1px solid var(--slate);
    border-radius:10px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--paper);
    transition:border-color .18s ease, transform .18s ease, background .18s ease;
  }
  a.card:hover, a.card:focus-visible{
    border-color:var(--blue);
    transform:translateX(3px);
    background:#eceeff;
    outline:none;
  }
  a.card:focus-visible{
    box-shadow:0 0 0 2px var(--ink), 0 0 0 4px var(--blue);
  }

  .card-left{
    display:flex;
    align-items:center;
    gap:13px;
  }

  .line-code{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    color:var(--amber-ink);
    background:var(--amber);
    padding:3px 7px;
    border-radius:4px;
    letter-spacing:0.03em;
    flex-shrink:0;
  }

  .card-text{ display:flex; flex-direction:column; gap:2px; }
  .card-title{ font-weight:600; font-size:15.5px; }
  .card-sub{ font-size:12.5px; color:var(--paper-dim); }

  .arrow{ color:var(--paper-dim); font-size:16px; transition:transform .18s ease, color .18s ease; }
  a.card:hover .arrow{ transform:translateX(2px); color:var(--blue); }

  .terminus{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--paper-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-top:4px;
  }
  .terminus .dot{
    position:static;
    background:var(--slate);
    border-color:var(--slate);
  }

  footer{
    text-align:center;
    margin-top:36px;
    font-size:11.5px;
    color:var(--slate);
    font-family:'IBM Plex Mono', monospace;
  }
</style>
</head>
